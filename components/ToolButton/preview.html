<!-- @dsCard group="Actions" height=112 subtitle="Tool dock with active tool and shortcut hint" -->
<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap"><style>body{margin:0;background:var(--canvas-bg)}</style></head>
<body>
<div class="o-root" style="padding:24px">
<div class="o-dock" role="toolbar" aria-label="Tools">
<button class="o-tool is-active" aria-label="Select (V)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3l14 8-6 2-2 6z"></path></svg></button>
<button class="o-tool" aria-label="Sticky note (N)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h16v11l-5 5H4z"></path><path d="M15 20v-5h5"></path></svg></button>
<button class="o-tool" aria-label="Shapes (R)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="8" height="8" rx="1"></rect><circle cx="16.5" cy="16.5" r="4.5"></circle></svg></button>
<button class="o-tool" aria-label="Text (T)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 6V4h14v2"></path><path d="M12 4v16"></path><path d="M9 20h6"></path></svg></button>
<button class="o-tool" aria-label="Connector (L)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 19L19 5"></path><path d="M12 5h7v7"></path></svg></button>
<button class="o-tool" aria-label="Pen (P)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20l4-1 11-11-3-3L5 16z"></path></svg></button>
<span style="width:1px;height:28px;background:var(--border);margin:0 4px"></span>
<button class="o-btn o-btn--ghost" style="height:44px">Agent <span class="o-kbd">Ctrl I</span></button>
</div>
</div>
<script>document.documentElement.setAttribute('data-ready','1');</script>
</body></html>
